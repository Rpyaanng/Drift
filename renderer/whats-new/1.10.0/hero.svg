<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="A blackjack table under a green lamp in a dark room, three players' hands on the felt, a board of the hub's biggest pots beside it, and a green cat sitting on the rail">
