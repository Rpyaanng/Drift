<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="Two PCs passing a file between them, piece by piece, each piece checked">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1022"/>
      <stop offset=".55" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#140d2a"/>
    </linearGradient>
    <radialGradient id="glowG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22c08a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22c08a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b58cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#b58cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c08a" stop-opacity="0"/>
      <stop offset=".2" stop-color="#22c08a" stop-opacity=".9"/>
      <stop offset=".8" stop-color="#b58cff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#b58cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0f1a33"/>
    </linearGradient>
    <linearGradient id="screenB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f4d"/>
      <stop offset="1" stop-color="#160f30"/>
    </linearGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee0a6"/>
      <stop offset="1" stop-color="#1a9e72"/>
    </linearGradient>
    <linearGradient id="pieceP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdb0ff"/>
      <stop offset="1" stop-color="#8f63e8"/>
    </linearGradient>
    <!-- Drift's cat (#coCat in renderer/index.html), flat green: its outline, ears, paws and face. Bottom of the paws at y 858 -->
    <g id="catFlat" stroke-linejoin="round" stroke-linecap="round">
      <path d="M1150 800C1300 812 1452 730 1456 590C1459 494 1400 440 1335 448C1284 455 1266 502 1284 532C1300 558 1334 582 1327 640C1319 702 1268 742 1196 762Z" fill="#22c08a" stroke="#1a1230" stroke-width="34"/>
      <path d="M345 355C340 250 380 150 440 125C510 105 590 160 645 225C710 205 790 205 845 225C900 160 980 105 1050 125C1110 150 1145 250 1140 355C1220 430 1260 560 1245 660C1230 760 1170 820 1080 835C900 860 600 860 420 835C320 820 250 740 240 620C235 520 270 420 345 355Z" fill="#22c08a" stroke="#1a1230" stroke-width="34"/>
      <path d="M425 335C425 262 445 205 468 198C508 194 552 224 580 258C524 274 474 300 425 335Z" fill="#128a62"/>
      <path d="M1059 335C1059 262 1039 205 1016 198C976 194 932 224 904 258C960 274 1010 300 1059 335Z" fill="#128a62"/>
      <path d="M408 820C400 760 450 722 512 722C576 722 620 762 618 812C616 850 560 858 510 858C450 858 412 852 408 820Z" fill="#22c08a" stroke="#1a1230" stroke-width="30"/>
      <path d="M918 820C910 760 960 722 1022 722C1086 722 1130 762 1128 812C1126 850 1070 858 1020 858C960 858 922 852 918 820Z" fill="#22c08a" stroke="#1a1230" stroke-width="30"/>
      <path d="M478 790v40M548 790v40M988 790v40M1058 790v40" fill="none" stroke="#1a1230" stroke-width="12" opacity=".7"/>
      <ellipse cx="470" cy="630" rx="58" ry="30" fill="#ff8fb8" opacity=".45"/><ellipse cx="1025" cy="630" rx="58" ry="30" fill="#ff8fb8" opacity=".45"/>
      <path d="M690 552C690 594 738 596 750 562C762 596 810 594 810 552" fill="none" stroke="#1a1230" stroke-width="22"/>
    </g>
    <g id="catOpen"><circle cx="545" cy="530" r="70" fill="#f4fff4" stroke="#1a1230" stroke-width="26"/><circle cx="950" cy="530" r="70" fill="#f4fff4" stroke="#1a1230" stroke-width="26"/><circle cx="553" cy="536" r="32" fill="#1b1030"/><circle cx="958" cy="536" r="32" fill="#1b1030"/><circle cx="541" cy="522" r="10" fill="#fff"/><circle cx="946" cy="522" r="10" fill="#fff"/></g>
    <g id="catShut" fill="none" stroke="#1a1230" stroke-width="28" stroke-linecap="round"><path d="M478 522Q545 586 612 522"/><path d="M883 522Q950 586 1017 522"/></g>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1600" height="640" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="140" cy="80" r="1.6" opacity=".7"/><circle cx="310" cy="150" r="1.1" opacity=".5"/><circle cx="520" cy="60" r="1.4" opacity=".6"/>
    <circle cx="690" cy="120" r="1" opacity=".45"/><circle cx="880" cy="50" r="1.7" opacity=".7"/><circle cx="1040" cy="140" r="1.2" opacity=".5"/>
    <circle cx="1210" cy="70" r="1.5" opacity=".65"/><circle cx="1400" cy="130" r="1.1" opacity=".5"/><circle cx="1520" cy="60" r="1.3" opacity=".6"/>
    <circle cx="80" cy="260" r="1" opacity=".4"/><circle cx="1560" cy="300" r="1" opacity=".4"/><circle cx="760" cy="230" r="1.2" opacity=".35"/>
    <circle cx="420" cy="560" r="1.1" opacity=".35"/><circle cx="1180" cy="580" r="1.2" opacity=".35"/><circle cx="980" cy="600" r="1" opacity=".3"/>
  </g>
  <!-- aurora bands -->
  <path d="M0 210 C 300 120, 520 300, 820 200 S 1320 100, 1600 190 L1600 0 L0 0 Z" fill="#22c08a" opacity=".07"/>
  <path d="M0 260 C 260 200, 600 330, 900 250 S 1380 170, 1600 250 L1600 0 L0 0 Z" fill="#b58cff" opacity=".06"/>

  <!-- glows behind the two PCs -->
  <circle cx="330" cy="360" r="260" fill="url(#glowG)"/>
  <circle cx="1270" cy="360" r="260" fill="url(#glowP)"/>

  <!-- the arc the pieces travel along -->
  <path d="M470 330 C 700 150, 900 150, 1130 330" fill="none" stroke="url(#beam)" stroke-width="10" stroke-linecap="round" opacity=".35" filter="url(#blur4)"/>
  <path d="M470 330 C 700 150, 900 150, 1130 330" fill="none" stroke="url(#beam)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- pieces on the way: checked ones carry a tick -->
  <g transform="translate(556 236) rotate(-24)"><rect x="-26" y="-20" width="52" height="40" rx="9" fill="url(#piece)"/><path d="M-11 0 l7 7 l15 -15" fill="none" stroke="#0b1a14" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(672 193) rotate(-12)"><rect x="-26" y="-20" width="52" height="40" rx="9" fill="url(#piece)"/><path d="M-11 0 l7 7 l15 -15" fill="none" stroke="#0b1a14" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(800 178)"><rect x="-30" y="-23" width="60" height="46" rx="10" fill="url(#piece)"/><path d="M-13 0 l8 8 l18 -18" fill="none" stroke="#0b1a14" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(928 193) rotate(12)"><rect x="-26" y="-20" width="52" height="40" rx="9" fill="url(#pieceP)"/><rect x="-14" y="-3" width="28" height="6" rx="3" fill="#1a0f33" opacity=".75"/></g>
  <g transform="translate(1044 236) rotate(24)" opacity=".75"><rect x="-26" y="-20" width="52" height="40" rx="9" fill="url(#pieceP)"/><rect x="-14" y="-3" width="28" height="6" rx="3" fill="#1a0f33" opacity=".75"/></g>
  <circle cx="800" cy="178" r="70" fill="#22c08a" opacity=".12" filter="url(#soft)"/>

  <!-- the sending PC -->
  <g transform="translate(330 360)">
    <rect x="-150" y="-110" width="300" height="190" rx="18" fill="#0c1428" stroke="#2c4470" stroke-width="3"/>
    <rect x="-136" y="-96" width="272" height="162" rx="10" fill="url(#screenA)"/>
    <!-- a file on its screen, cut into pieces -->
    <g transform="translate(-40 -20)">
      <path d="M-34 -50 h48 l22 22 v78 h-70 z" fill="#e9f3ff" opacity=".95"/>
      <path d="M14 -50 v22 h22" fill="#c9d8ee"/>
      <rect x="-24" y="-14" width="50" height="7" rx="3.5" fill="#22c08a"/>
      <rect x="-24" y="2" width="50" height="7" rx="3.5" fill="#22c08a"/>
      <rect x="-24" y="18" width="50" height="7" rx="3.5" fill="#22c08a" opacity=".45"/>
      <rect x="-24" y="34" width="34" height="7" rx="3.5" fill="#22c08a" opacity=".25"/>
    </g>
    <g transform="translate(70 -18)" fill="#9fb4d8">
      <rect x="-30" y="-30" width="60" height="9" rx="4.5" opacity=".7"/>
      <rect x="-30" y="-12" width="46" height="9" rx="4.5" opacity=".5"/>
      <rect x="-30" y="6" width="54" height="9" rx="4.5" opacity=".35"/>
    </g>
    <rect x="-26" y="80" width="52" height="34" fill="#16223e"/>
    <rect x="-80" y="112" width="160" height="12" rx="6" fill="#1c2a4c"/>
  </g>

  <!-- the receiving PC: the file filling up -->
  <g transform="translate(1270 360)">
    <rect x="-150" y="-110" width="300" height="190" rx="18" fill="#140c2a" stroke="#4b3684" stroke-width="3"/>
    <rect x="-136" y="-96" width="272" height="162" rx="10" fill="url(#screenB)"/>
    <g transform="translate(-60 -18)">
      <path d="M-34 -50 h48 l22 22 v78 h-70 z" fill="#efe8ff" opacity=".95"/>
      <path d="M14 -50 v22 h22" fill="#d6c8f5"/>
      <path d="M-22 4 l8 8 l18 -18" fill="none" stroke="#22c08a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(40 -4)">
      <rect x="-14" y="-44" width="104" height="14" rx="7" fill="#2a1f4d"/>
      <rect x="-14" y="-44" width="72" height="14" rx="7" fill="#22c08a"/>
      <rect x="-14" y="-18" width="74" height="9" rx="4.5" fill="#b9a6e8" opacity=".55"/>
      <rect x="-14" y="0" width="56" height="9" rx="4.5" fill="#b9a6e8" opacity=".35"/>
    </g>
    <rect x="-26" y="80" width="52" height="34" fill="#20163c"/>
    <rect x="-80" y="112" width="160" height="12" rx="6" fill="#2a1f4d"/>
  </g>

  <!-- the cats: one on each PC (the sender's watching the pieces go), and a small one riding the middle piece across -->
  <g transform="translate(250 251) scale(.088) translate(-742 -858)"><use href="#catFlat"/><use href="#catOpen"/></g>
  <g transform="translate(1352 251) scale(-.088 .088) translate(-742 -858)"><use href="#catFlat"/><use href="#catOpen"/></g>
  <g transform="translate(796 156) scale(.034) translate(-742 -858)"><use href="#catFlat"/><use href="#catOpen"/></g>

  <!-- the hub, in the distance: it sets up the connection but never holds the file -->
  <g transform="translate(800 74)" opacity=".85">
    <path d="M-30 8 C -170 30, -330 90, -440 170" fill="none" stroke="#3a4f80" stroke-width="2" stroke-dasharray="3 9"/>
    <path d="M30 8 C 170 30, 330 90, 440 170" fill="none" stroke="#3a4f80" stroke-width="2" stroke-dasharray="3 9"/>
    <circle r="28" fill="#0f1730" stroke="#3a4f80" stroke-width="2.5"/>
    <circle r="10" fill="none" stroke="#7f95c4" stroke-width="2.5"/>
    <path d="M-10 0 h-11 M10 0 h11 M0 10 v11" stroke="#7f95c4" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
