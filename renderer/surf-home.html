<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src https: data:; form-action drift:">
<title>New tab</title>
<!-- Drift's own start page for the Surf tab, served as drift://home/ by web.js. Its data (quotes, weather, news, stats) and its
     saved layout come from drift://home/api/… (surf-home.js). -->
<style>
  :root { color-scheme: dark; --bg: #05070d; --accent: #22c08a; --hi: #b58cff; --up: #2bd48f; --down: #ff5d6c; --ink: rgba(255,255,255,.94); --dim: rgba(255,255,255,.56); --faint: rgba(255,255,255,.34);
    --line: rgba(255,255,255,.09); --card: rgba(14,17,26,.62); --card-hi: rgba(22,26,38,.72); --r: 16px; --gap: 14px; --pad: 18px; }
  :root[data-density="compact"] { --gap: 10px; --pad: 13px; --r: 12px; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* the colour is the page's (html) only: a background on body would be a box drawn over the backdrop (.bg, at z-index -1) */
  html { background: var(--bg); }
  html, body { margin: 0; height: 100%; color: var(--ink);
    font: 13.5px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-y: auto; overflow-x: hidden; }
  body::-webkit-scrollbar { width: 10px; } body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  /* ---- backdrops ---- */
  .bg { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
  .sky { position: absolute; inset: -20vmax; filter: blur(70px) saturate(130%); opacity: .75; }
  .sky i { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: drift 38s ease-in-out infinite alternate; }
  .sky i:nth-child(1) { width: 70vmax; height: 46vmax; left: 4vmax; top: 34vmax; background: radial-gradient(closest-side, var(--accent), transparent); opacity: .36; }
  .sky i:nth-child(2) { width: 60vmax; height: 50vmax; left: 56vmax; top: 14vmax; background: radial-gradient(closest-side, var(--hi), transparent); opacity: .28; animation-duration: 46s; animation-delay: -12s; }
  .sky i:nth-child(3) { width: 90vmax; height: 60vmax; left: 20vmax; top: 66vmax; background: radial-gradient(closest-side, #0b3a52, transparent); opacity: .9; animation-duration: 54s; animation-delay: -30s; }
  @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(6vmax, -4vmax) scale(1.12); } 100% { transform: translate(-5vmax, 3vmax) scale(.94); } }
  .grain { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, transparent 30%, rgba(0,0,0,.6)); }
  .photo { position: absolute; inset: 0; background-size: cover; background-position: center; display: none; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.7)); }
  :root[data-bg="solid"] .sky { display: none; }
  :root[data-bg="grid"] .sky { opacity: .35; }
  :root[data-bg="grid"] .grain { background: linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 40px 40px, linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 40px 40px, radial-gradient(ellipse at 50% 0%, transparent 20%, rgba(0,0,0,.85)); }
  :root[data-bg="photo"] .sky { display: none; } :root[data-bg="photo"] .photo { display: block; }
  /* neon: a synthwave horizon drawn on a canvas (drawNeon), with scanlines over it */
  #neon { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .scan { position: absolute; inset: 0; display: none; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
  :root[data-bg="neon"] .sky { display: none; } :root[data-bg="neon"] #neon, :root[data-bg="neon"] .scan { display: block; }
  :root[data-bg="neon"] .grain { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55)); }
  /* glassier cards, so the scene shows through them */
  :root[data-bg="neon"] .w { background: rgba(8,6,18,.42); backdrop-filter: blur(10px) saturate(160%); border-color: color-mix(in srgb, var(--hi) 28%, transparent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 24px color-mix(in srgb, var(--hi) 8%, transparent); }
  /* kitty: Drift's cat (the mascot from index.html's #coCat) in a cozy dusk, built by kitty() when chosen */
  .kitty { position: absolute; inset: 0; display: none; overflow: hidden;
    background: radial-gradient(ellipse at 50% 110%, color-mix(in srgb, var(--hi) 30%, #2a1236), transparent 60%),
      linear-gradient(#0c0a1e, color-mix(in srgb, var(--accent) 14%, #171030) 55%, color-mix(in srgb, var(--hi) 22%, #22113a)); }
  :root[data-bg="kitty"] .sky { display: none; } :root[data-bg="kitty"] .kitty { display: block; }
  :root[data-bg="kitty"] .grain { background: radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(0,0,0,.4)); }
  :root[data-bg="kitty"] .w { background: rgba(18,12,34,.55); border-color: color-mix(in srgb, var(--hi) 22%, transparent); border-radius: calc(var(--r) + 6px); }
  :root[data-bg="kitty"] .clock { text-shadow: 0 0 30px color-mix(in srgb, var(--hi) 45%, transparent); }
  .kitty .moon { position: absolute; right: 12%; top: 9%; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle at 38% 36%, #fff8e6, #f6dcb4 60%, #e9c393);
    box-shadow: 0 0 60px 18px rgba(255,230,190,.18), 0 0 140px 50px color-mix(in srgb, var(--hi) 14%, transparent); }
  .kitty .moon::after { content: ""; position: absolute; left: 26%; top: 52%; width: 16px; height: 12px; border-radius: 50%; background: rgba(210,170,130,.35); box-shadow: 34px -22px 0 -3px rgba(210,170,130,.3); }
  .kitty .twinkle { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .2; transform: scale(.6); } }
  .kitty .cloud { position: absolute; height: 60px; border-radius: 60px; background: color-mix(in srgb, var(--hi) 18%, rgba(255,255,255,.08)); filter: blur(6px); animation: cloud linear infinite; }
  .kitty .cloud::before, .kitty .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
  .kitty .cloud::before { width: 55%; height: 140%; left: 14%; bottom: 20%; } .kitty .cloud::after { width: 38%; height: 110%; right: 14%; bottom: 30%; }
  @keyframes cloud { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  .kitty .floaty { position: absolute; bottom: -40px; animation: floaty linear infinite; }
  .kitty .floaty svg { display: block; width: 100%; height: 100%; animation: sway 4s ease-in-out infinite alternate; }
  @keyframes floaty { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: var(--o); } 85% { opacity: var(--o); } 100% { transform: translateY(-112vh); opacity: 0; } }
  @keyframes sway { from { transform: translateX(-14px) rotate(-12deg); } to { transform: translateX(14px) rotate(12deg); } }
  /* the cat: layers of one drawing (same viewBox), each only moved: the tail swishes, the body breathes, the eyes blink and the
     pupils follow the mouse */
  /* (as wide as the margin beside the cards allows, so it sits beside them on a wide screen) */
  .kittycat .cat { position: absolute; right: 1.5vw; bottom: -1.6vw; width: clamp(150px, calc(50vw - 660px), 340px); aspect-ratio: 1360 / 820; pointer-events: auto; cursor: pointer;
    filter: drop-shadow(0 6px 0 rgba(10,6,24,.35)); transform-origin: 50% 100%; }       /* (a flat cast shadow, as in a cel: no glow over its ink) */
  .kitty .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* the cat's colours, as index.html mixes them from the accent: on the layer, where the gradients that use them are too */
  .kittycat {
    --cat-base: var(--accent); --cat-mid: color-mix(in oklab, var(--accent), white 22%); --cat-hi: color-mix(in oklab, var(--accent), white 62%);
    --cat-rim: color-mix(in oklab, var(--accent), white 80%); --cat-shade: color-mix(in oklab, var(--accent), black 48%);
    --cat-deep: color-mix(in oklab, var(--accent), black 50%); --cat-dark: color-mix(in oklab, var(--accent), black 72%); }
  .kittycat .cat > *, .kittycat .cat .eyes > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .kittycat .cat .tail { transform-origin: 75.7% 86%; animation: swish 3.2s ease-in-out infinite alternate; }
  .kittycat .cat .bodyl { transform-origin: 50% 100%; animation: breathe 3.6s ease-in-out infinite; }
  .kittycat .cat .eyes { transform-origin: 50% 53.7%; animation: blink 6s infinite; }
  .kittycat .cat .eyes .pupils { transition: transform .25s ease-out; }
  @keyframes swish { from { transform: rotate(-5deg); } to { transform: rotate(7deg); } }
  @keyframes breathe { 50% { transform: scale(1.015, 1.03); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } 96% { transform: scaleY(1); } }
  .kittycat .cat.hop { animation: hop .55s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes hop { 40% { transform: translateY(-14%) scale(.97, 1.04); } 70% { transform: translateY(0) scale(1.04, .96); } }
  .kittycat .pop { position: absolute; width: 28px; height: 28px; pointer-events: none; animation: pop 1.4s ease-out forwards; }
  @keyframes pop { from { transform: translate(-50%, 0) scale(.4); opacity: 1; } to { transform: translate(-50%, -140px) scale(1.3); opacity: 0; } }
  /* the cat's own layer: above the page's boxes (so it can be clicked), below the cards, which come after it */
  .kittycat { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; display: none; }
  :root[data-bg="kitty"] .kittycat { display: block; }
  @media (prefers-reduced-motion: reduce) { .kitty *, .kittycat * { animation: none !important; } }
  :root[data-bg="neon"] .clock { text-shadow: 0 0 24px color-mix(in srgb, var(--hi) 55%, transparent), 0 0 60px color-mix(in srgb, var(--accent) 30%, transparent); }

  /* ---- layout ---- */
  .wrap { width: min(1240px, 100%); margin: 0 auto; padding: 22px 28px 40px; }
  header.top { display: flex; align-items: center; gap: 14px; height: 36px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 11px; line-height: 1; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }
  .brand .logo { height: 14px; width: auto; overflow: visible; }       /* Drift's logo, cropped to its waves (icon.svg) */
  .brand .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.3); }
  .brand .surf { color: var(--accent); transition: color .6s; }       /* (Drift's accent, by default: it eases along as Cycle changes it) */
  .spacer { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.04);
    color: var(--dim); cursor: pointer; transition: background .2s, color .2s, border-color .2s; font-size: 12.5px; }
  .chip:hover { background: rgba(255,255,255,.09); color: var(--ink); }
  .chip.on { border-color: var(--accent); color: var(--ink); }
  .chip svg { width: 15px; height: 15px; }

  .hero { display: grid; grid-template-columns: 1fr minmax(0, 560px); align-items: end; gap: 28px; margin: 26px 0 22px; }
  .clock { font: 200 clamp(56px, 9vw, 104px)/.9 "Segoe UI Variable Display", "Segoe UI Light", system-ui; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .clock small { font-size: .32em; font-weight: 300; color: var(--dim); margin-left: .25em; letter-spacing: .04em; }
  .hello { margin-top: 10px; font: 300 18px/1.3 "Segoe UI Variable Display", system-ui; color: rgba(255,255,255,.75); }
  .hello b { font-weight: 500; color: var(--ink); }
  .date { margin-top: 2px; color: var(--dim); font-size: 13px; }
  :root[data-clock="off"] .clock { display: none; }

  form.search { position: relative; }
  form.search input { width: 100%; height: 52px; padding: 0 120px 0 48px; border-radius: 14px; border: 1px solid var(--line); outline: none; font-size: 15px;
    background: rgba(12,14,22,.7); backdrop-filter: blur(30px) saturate(150%); box-shadow: 0 20px 60px rgba(0,0,0,.45); transition: border-color .2s, box-shadow .2s; }
  form.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent), 0 20px 60px rgba(0,0,0,.45); }
  form.search input::placeholder { color: var(--faint); }
  form.search > svg { position: absolute; z-index: 1; left: 17px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); opacity: .5; pointer-events: none; }
  form.search select { position: absolute; right: 8px; top: 8px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.05); padding: 0 8px; color: var(--dim); outline: none; cursor: pointer; }
  form.search select option { background: #141824; color: #fff; }

  /* ---- widgets ---- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); grid-auto-flow: row dense; }
  .w { grid-column: span 4; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: var(--pad); backdrop-filter: blur(24px) saturate(140%);
    min-width: 0; position: relative; display: flex; flex-direction: column; gap: 12px; }
  .w[data-size="s"] { grid-column: span 3; } .w[data-size="m"] { grid-column: span 4; } .w[data-size="l"] { grid-column: span 6; } .w[data-size="xl"] { grid-column: span 12; }
  .w > h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 10.5px; line-height: 1; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .w > h3 .sub { margin-left: auto; letter-spacing: .02em; text-transform: none; font-weight: 400; color: var(--faint); font-size: 11.5px; }
  .w > h3 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .empty { color: var(--faint); font-size: 12.5px; padding: 6px 0; }
  .empty button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .skel { height: 14px; border-radius: 6px; background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.1), rgba(255,255,255,.05)); background-size: 200% 100%; animation: sh 1.4s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .num { font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }

  /* shortcuts */
  .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .link { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 6px 10px; border-radius: 12px; border: 1px solid transparent; transition: background .2s, border-color .2s, transform .2s; }
  .link:hover, .link:focus-visible { background: rgba(255,255,255,.06); border-color: var(--line); transform: translateY(-2px); outline: none; }
  .ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: rgba(255,255,255,.07); overflow: hidden; font-weight: 600; font-size: 15px; position: relative; }
  .ico img { width: 22px; height: 22px; }
  .link span { font-size: 12px; color: rgba(255,255,255,.78); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* markets */
  .tick { display: grid; grid-template-columns: minmax(0, 1fr) 84px 92px; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 10px; }
  .tick:hover { background: rgba(255,255,255,.04); }
  .tick + .tick { border-top: 1px solid var(--line); }
  .tick .sym { font-weight: 600; font-size: 13px; } .tick .nm { color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tick svg { width: 84px; height: 28px; display: block; }
  .tick .px { text-align: right; } .tick .px b { display: block; font-weight: 600; } .tick .px span { font-size: 11.5px; }
  .pill { display: inline-block; padding: 1px 6px; border-radius: 6px; font-size: 11.5px; }
  .pill.up { background: color-mix(in srgb, var(--up) 15%, transparent); } .pill.down { background: color-mix(in srgb, var(--down) 15%, transparent); }

  /* weather */
  .wx-now { display: flex; align-items: center; gap: 14px; }
  .wx-now .big { font: 200 52px/1 "Segoe UI Variable Display", system-ui; }
  .wx-now .icon { font-size: 34px; line-height: 1; }
  .wx-now .what { color: var(--dim); font-size: 12.5px; line-height: 1.6; }
  .wx-now .what b { color: var(--ink); font-weight: 500; font-size: 14px; }
  .wx-days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .wx-days div { text-align: center; padding: 8px 2px; border-radius: 10px; background: rgba(255,255,255,.03); font-size: 12px; }
  .wx-days div span { display: block; color: var(--faint); font-size: 11px; } .wx-days div i { display: block; font-style: normal; font-size: 18px; margin: 3px 0; }
  .wx-days div em { font-style: normal; color: var(--faint); }

  /* stats */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.035); }
  .kpi b { display: block; font: 300 24px/1.1 "Segoe UI Variable Display", system-ui; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 11px; color: var(--faint); letter-spacing: .02em; }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 78px; }
  .bar { display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .bar i { width: 100%; max-width: 26px; border-radius: 5px 5px 2px 2px; background: color-mix(in srgb, var(--accent) 55%, transparent); min-height: 2px; }
  .bar.now i { background: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 50%, transparent); }
  .bar span { font-size: 10.5px; color: var(--faint); }
  .tops { display: flex; flex-direction: column; gap: 7px; }
  .top { display: grid; grid-template-columns: 110px 1fr 52px; gap: 10px; align-items: center; font-size: 12px; }
  .top .s { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(255,255,255,.8); }
  .top .t { height: 6px; border-radius: 3px; background: rgba(255,255,255,.06); overflow: hidden; } .top .t i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--hi)); border-radius: 3px; }
  .top .v { text-align: right; color: var(--faint); }
  .meter { display: grid; grid-template-columns: 62px 1fr 64px; gap: 10px; align-items: center; font-size: 12px; }
  .meter .t { height: 8px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; } .meter .t i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .6s; }
  .meter .t i.warn { background: #f5b83d; } .meter .t i.hot { background: var(--down); }
  .meter .v { text-align: right; } .meter > span:first-child { color: var(--dim); }
  .sysline { color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .specs { display: grid; grid-template-columns: 74px 1fr; gap: 7px 12px; font-size: 12.5px; }
  .specs dt { color: var(--faint); } .specs dd { margin: 0; color: rgba(255,255,255,.88); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hubtag { border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--ink); cursor: default; }
  .hubtag:hover { background: rgba(255,255,255,.04); }
  .hubtag i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .shout { font: 300 17px/1.5 "Segoe UI Variable Display", system-ui; color: rgba(255,255,255,.86); white-space: pre-wrap; overflow-wrap: anywhere; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 20; transition: opacity .25s, transform .25s;
    background: #161a26; border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; box-shadow: 0 16px 50px rgba(0,0,0,.5); font-size: 13px; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* news */
  .news { display: flex; flex-direction: column; }
  .story { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 4px; border-radius: 8px; }
  .story + .story { border-top: 1px solid var(--line); }
  .story:hover { background: rgba(255,255,255,.04); }
  .story .n { color: var(--faint); font-size: 11.5px; padding-top: 1px; text-align: right; }
  .story b { font-weight: 500; font-size: 13px; display: block; }
  .story span { color: var(--faint); font-size: 11.5px; }

  /* notes */
  textarea.notes { flex: 1; min-height: 140px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.2); padding: 10px 12px; outline: none; line-height: 1.5; }
  textarea.notes:focus { border-color: var(--accent); }

  footer.hint { margin-top: 22px; text-align: center; color: var(--faint); font-size: 12px; }

  /* ---- customize drawer ---- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: #0e111a; border-left: 1px solid var(--line); z-index: 11; transform: translateX(100%);
    transition: transform .28s cubic-bezier(.2,.7,.2,1); display: flex; flex-direction: column; box-shadow: -30px 0 80px rgba(0,0,0,.5); }
  body.custom .scrim { opacity: 1; pointer-events: auto; } body.custom .drawer { transform: none; }
  .drawer header { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .drawer header h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }

  .row label { flex: 1; color: rgba(255,255,255,.82); }

  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); }
  .field { width: 100%; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.04); padding: 0 10px; outline: none; }
  .field:focus { border-color: var(--accent); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatches button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .swatches button.on { border-color: #fff; }
  .swatches button.drift { position: relative; }       /* Drift's own: a ring inside, as it follows the app rather than being one colour */
  .swatches button.drift::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85); }
  .wl { display: flex; flex-direction: column; gap: 6px; }
  .wl .item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 10px; background: rgba(255,255,255,.035); border: 1px solid transparent; }
  .wl .item.drag { opacity: .4; } .wl .item.over { border-color: var(--accent); }
  .wl .grip { cursor: grab; color: var(--faint); padding: 0 2px; user-select: none; }
  .wl .item label { flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .ibtn { width: 26px; height: 26px; border-radius: 7px; border: 0; background: none; color: var(--dim); cursor: pointer; display: grid; place-items: center; }
  .ibtn:hover { background: rgba(255,255,255,.08); color: var(--ink); }
  .ibtn svg { width: 15px; height: 15px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }

  .ask .box { width: min(440px, 92vw); padding: 24px 24px 20px; border-radius: 18px; text-align: center; color: var(--ink); background: rgba(11,13,19,.84);
    backdrop-filter: blur(30px) saturate(150%); border: 1px solid var(--line); box-shadow: 0 24px 80px rgba(0,0,0,.6); }

  // ---------- the neon backdrop ----------
  // A synthwave horizon in the theme's two colours: a striped sun setting behind wireframe mountains, a perspective grid rolling
  // toward you, twinkling stars and the odd meteor. Drawn at up to 30 frames a second, only while the page is on screen; with
  // reduced motion asked for, one still frame.
  const neon = (() => {
    const cv = document.getElementById('neon'), cx = cv.getContext('2d');
    let on = false, raf = 0, last = 0, W = 0, H = 0, stars = [], ridge = [], meteor = null;
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const rnd = (a, b) => a + Math.random() * (b - a);
    function size() {
      const dpr = Math.min(devicePixelRatio || 1, 1.5);
      W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.round((W * H) / 9000) }, () => ({ x: rnd(0, W), y: rnd(0, H * 0.56), r: rnd(0.3, 1.3), p: rnd(0, 6.3), s: rnd(0.6, 2) }));
      // two ridges of mountains: far ones low and faint, near ones taller, both open in the middle where the sun sets
      ridge = [0.55, 1].map((k) => { const pts = []; for (let x = -20; x <= W + 20; x += rnd(28, 70)) { const mid = Math.abs(x - W / 2) / (W / 2); pts.push([x, rnd(0.25, 1) * H * 0.13 * k * Math.min(1, mid * 1.8 + 0.08)]); } return pts; });

      cx.globalAlpha = 1; cx.fillStyle = fl; cx.fillRect(0, hz, W, H - hz);
      // the grid: lines to the vanishing point, and cross lines rolling toward you, brighter as they come near
      const line = (x1, y1, x2, y2, a) => { cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.globalAlpha = a * 0.18; cx.lineWidth = 5; cx.stroke(); cx.globalAlpha = a; cx.lineWidth = 1.1; cx.stroke(); };

    }

    // markets
    const syms = h('input', { class: 'field', spellcheck: 'false', placeholder: 'AAPL, NVDA, ^GSPC, BTC-USD' }); syms.value = S.symbols.join(', ');
    syms.addEventListener('change', () => { S.symbols = syms.value.split(/[\s,]+/).map((x) => x.trim().toUpperCase()).filter(Boolean).slice(0, 12); save(); });
    p.append(h('section', {}, h('h4', {}, 'Markets'), syms, h('div', { class: 'note' }, 'Up to 12 Yahoo Finance symbols: stocks, ETFs, indexes (^GSPC, ^DJI), crypto (ETH-USD), currencies (EURUSD=X).')));

    // weather
    p.append(h('section', {}, h('h4', {}, 'Weather'), text('city', 'City, e.g. Toronto'),
      h('div', { style: 'margin-top:6px' }, row('Units', seg([['c', '°C'], ['f', '°F']], S.unit, (v) => { S.unit = v; save(); })))));

    // shortcuts
    const lw = h('div');
    S.links.forEach((l, i) => {
      const n = h('input', { class: 'field', placeholder: 'Name' }); n.value = l[0];
      const u = h('input', { class: 'field', placeholder: 'https://…', spellcheck: 'false' }); u.value = l[1];
      const upd = () => { let url = u.value.trim(); if (url && !/^[a-z]+:\/\//i.test(url)) url = 'https://' + url; S.links[i] = [n.value.trim() || host(url) || 'Link', url]; save(); };
      n.addEventListener('change', upd); u.addEventListener('change', upd);
      lw.append(h('div', { class: 'linkrow' }, n, u, h('button', { class: 'ibtn', title: 'Remove', onclick: () => { S.links.splice(i, 1); save(); } }, icon(I.x))));
    });
    p.append(h('section', {}, h('h4', {}, 'Shortcuts'), lw, S.links.length < 24 ? h('button', { class: 'add', onclick: () => { S.links.push(['', '']); save(); const f = $('#panel .linkrow:last-of-type input'); f && f.focus(); } }, '+ Add a shortcut') : null));

    p.append(h('section', { style: 'border:0' }, h('button', { class: 'add danger', onclick: async () => { if (await ask('Reset the start page?', 'Its widgets, shortcuts, background and colours go back the way they were.', 'Reset')) { S = merge(null); save(); } } }, 'Reset to defaults')));
    p.scrollTop = scroll;
  }
  const close = () => document.body.classList.remove('custom');
  $('#customize').addEventListener('click', () => (document.body.classList.contains('custom') ? close() : openPanel()));
  $('#close').addEventListener('click', close); $('#scrim').addEventListener('click', close);
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.body.classList.contains('custom')) { e.stopPropagation(); close(); } });
  $('#refresh').addEventListener('click', () => { statsP = null; render(); });

  // ---------- go ----------
  applyLook(); render();
  // the saved layout (kept by Drift, so it survives clearing the browser's data) wins over this browser's copy; on the hub, the
  // host's changes and what they let guests see are picked up every few seconds
  reload().then(() => { if (MODE.hub) setInterval(() => { if (!document.hidden) reload(); }, 8000); });
  // Drift's accent (see DRIFT), asked again each second while the page follows it: a palette picked in Scenes, or Cycle, carries here
  async function driftAccent() {
    try {
      const r = await (await call('accent')).json(), ok = (x) => /^#[0-9a-f]{6}$/i.test(String(x));
      if (!r || !ok(r.a) || !ok(r.b) || (r.a === DRIFT[0] && r.b === DRIFT[1])) return;
      DRIFT = [r.a, r.b];
      if (S.accent === 'drift') { document.documentElement.style.setProperty('--accent', r.a); document.documentElement.style.setProperty('--hi', r.b); }
      const sw = document.querySelector('.swatches .drift');
      if (sw) sw.style.setProperty('--c', `linear-gradient(135deg,${r.a},${r.b})`);
    } catch {}
  }
  driftAccent();
  setInterval(() => { if (!document.hidden && (S.accent === 'drift' || document.body.classList.contains('custom'))) driftAccent(); }, 1000);
  // the page opens with the keys in the search box
  addEventListener('focus', () => { if (!document.body.classList.contains('custom')) $('#q').focus(); });
  // the data stays fresh in a tab left open
  setInterval(() => { if (!document.hidden && !document.body.classList.contains('custom') && !(document.activeElement && document.activeElement.matches('textarea'))) { statsP = null; render(); } }, 5 * 60000);
})();
</script>
</body>
</html>
