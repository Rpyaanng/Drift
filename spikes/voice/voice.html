<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<style>
  body { font: 13px system-ui, sans-serif; background: #15171c; color: #dde; margin: 12px; }
  #mic { display: inline-block; padding: 2px 8px; border-radius: 9px; background: #333; }
  #mic.live { background: #c22; color: #fff; }
  .peer { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: 10px 8px 0 0;
    border-radius: 50%; background: #2a2e38; box-shadow: 0 0 0 0 #3c6; transition: box-shadow 60ms; }
  .peer.speaking { box-shadow: 0 0 0 3px #3c6; }
  #log { margin-top: 10px; color: #889; white-space: pre-wrap; }
</style>
</head>
<body>
  <div><b id="me"></b> <span id="mic">mic off</span></div>
  <div id="peers"></div>
  <div id="log"></div>
  <script src="voice.js"></script>
</body>
</html>
